[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".runtime",
    ".venv-ml",
    "data",
    "dist",
    "evaluation",
    "logs",
    "models",
    "runs",
    "templates",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
